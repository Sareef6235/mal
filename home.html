<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ഹോം | നിസ്കാരം ട്രാക്കർ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-slate-50 to-indigo-50 pb-24 text-slate-800">
  <main class="mx-auto w-full max-w-[420px] px-4 pt-4">
    <header class="rounded-3xl border border-white/30 bg-white/70 p-4 shadow-xl backdrop-blur-md">
      <h1 class="text-xl font-bold">🕌 നിസ്കാരം ട്രാക്കർ</h1>
      <p class="text-xs text-slate-600">Daily Prayer &amp; Study Tracker</p>
      <div class="mt-3 rounded-2xl bg-emerald-100/80 p-3">
        <p class="text-xs text-emerald-700">📅 ഇന്നത്തെ തിയതി</p>
        <p id="todayDate" class="text-sm font-semibold text-emerald-900"></p>
      </div>
    </header>

    <section class="mt-4 space-y-3">
      <article class="rounded-2xl border border-white/30 bg-white/70 p-4 shadow-lg backdrop-blur">
        <h2 class="font-semibold">🏆 ഇന്നത്തെ ടോപ്പർ</h2>
        <p id="dailyTopper" class="text-sm text-slate-700">ഡാറ്റയില്ല</p>
      </article>
      <article class="rounded-2xl border border-white/30 bg-white/70 p-4 shadow-lg backdrop-blur">
        <h2 class="font-semibold">📅 ആഴ്ചയിലെ ടോപ്പർ</h2>
        <p id="weeklyTopper" class="text-sm text-slate-700">ഡാറ്റയില്ല</p>
      </article>
      <article class="rounded-2xl border border-white/30 bg-white/70 p-4 shadow-lg backdrop-blur">
        <h2 class="font-semibold">📆 മാസത്തിലെ ടോപ്പർ</h2>
        <p id="monthlyTopper" class="text-sm text-slate-700">ഡാറ്റയില്ല</p>
      </article>
    </section>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 mx-auto grid w-full max-w-md grid-cols-4 border-t border-slate-200 bg-white/95 px-1 py-2 shadow-2xl backdrop-blur-md">
    <a href="home.html" class="flex flex-col items-center text-[11px] font-medium text-emerald-600"><span class="text-lg">🏠</span>ഹോം</a>
    <a href="tracker.html" class="flex flex-col items-center text-[11px] font-medium text-slate-500"><span class="text-lg">📖</span>ട്രാക്കർ</a>
    <a href="history.html" class="flex flex-col items-center text-[11px] font-medium text-slate-500"><span class="text-lg">⏱</span>ഹിസ്റ്ററി</a>
    <a href="profile.html" class="flex flex-col items-center text-[11px] font-medium text-slate-500"><span class="text-lg">👤</span>പ്രൊഫൈൽ</a>
  </nav>

  <script>
    const STORAGE_KEY = 'niskaram-tracker-entries';
    document.getElementById('todayDate').textContent = new Intl.DateTimeFormat('ml-IN', { dateStyle: 'full' }).format(new Date());

    function getEntries() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function getTopper(type) {
      const entries = getEntries();
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const filtered = entries.filter((entry) => {
        const d = new Date(`${entry.date}T00:00:00`);
        if (Number.isNaN(d.getTime())) return false;
        if (type === 'daily') return d.getTime() === today.getTime();
        if (type === 'weekly') {
          const start = new Date(today);
          start.setDate(today.getDate() - today.getDay());
          return d >= start && d <= today;
        }
        return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
      });

      const map = {};
      filtered.forEach((e) => {
        map[e.name] = (map[e.name] || 0) + Number(e.points || 0);
      });
      const winner = Object.entries(map).sort((a, b) => b[1] - a[1])[0];
      return winner ? `${winner[0]} - ${winner[1]} pt` : 'ഡാറ്റയില്ല';
    }

    document.getElementById('dailyTopper').textContent = getTopper('daily');
    document.getElementById('weeklyTopper').textContent = getTopper('weekly');
    document.getElementById('monthlyTopper').textContent = getTopper('monthly');
  </script>
</body>
</html>
