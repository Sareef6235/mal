<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | നിസ്കാരം ട്രാക്കർ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-slate-50 to-indigo-50 pb-24 text-slate-800">
  <main class="mx-auto w-full max-w-[420px] px-4 pt-4">
    <section class="rounded-3xl border border-white/30 bg-white/70 p-5 shadow-xl backdrop-blur-md">
      <h1 class="text-xl font-bold">Admin Login</h1>
      <p class="text-sm text-slate-600">Username: admin / Password: admin1</p>

      <form id="loginForm" class="mt-4 space-y-3">
        <input id="username" type="text" placeholder="Username" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" required />
        <input id="password" type="password" placeholder="Password" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" required />
        <button class="w-full rounded-xl bg-emerald-600 px-3 py-2 text-sm font-semibold text-white" type="submit">Login</button>
      </form>
    </section>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 mx-auto grid w-full max-w-md grid-cols-4 border-t border-slate-200 bg-white/95 px-1 py-2 shadow-2xl backdrop-blur-md">
    <a href="home.html" class="flex flex-col items-center text-[11px] font-medium text-slate-500"><span class="text-lg">🏠</span>ഹോം</a>
    <a href="tracker.html" class="flex flex-col items-center text-[11px] font-medium text-slate-500"><span class="text-lg">📖</span>ട്രാക്കർ</a>
    <a href="history.html" class="flex flex-col items-center text-[11px] font-medium text-slate-500"><span class="text-lg">⏱</span>ഹിസ്റ്ററി</a>
    <a href="profile.html" class="flex flex-col items-center text-[11px] font-medium text-emerald-600"><span class="text-lg">👤</span>പ്രൊഫൈൽ</a>
  </nav>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (u === 'admin' && p === 'admin1') {
        localStorage.setItem('niskaram-admin-auth', '1');
        location.href = 'admin.html';
      } else {
        alert('Invalid Login');
      }
    });
  </script>
</body>
</html>
