<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon-192.svg" />
  <title>Login | SaaS Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { boxShadow: { soft: '0 20px 45px -25px rgba(2, 6, 23, 0.55)' } } }
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-full text-slate-800 dark:text-slate-100">
  <main class="min-h-screen flex items-center justify-center p-4">
    <section class="glass shadow-soft rounded-3xl w-full max-w-md p-8 space-y-6">
      <header class="text-center">
        <h1 class="text-3xl font-bold">Welcome Back</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Sign in to your dashboard</p>
      </header>

      <form id="loginForm" class="space-y-4" autocomplete="on">
        <div>
          <label class="block text-sm font-medium mb-1" for="email">Email</label>
          <input id="email" name="email" type="email" required class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white/70 dark:bg-slate-900/60 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="admin@example.com" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" for="password">Password</label>
          <input id="password" name="password" type="password" required class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white/70 dark:bg-slate-900/60 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" />
        </div>
        <button id="loginButton" type="submit" class="w-full rounded-xl bg-blue-600 hover:bg-blue-700 transition text-white font-semibold py-3">Sign In</button>
      </form>

      <p class="text-sm text-center text-slate-500 dark:text-slate-400">Demo admin: admin@example.com / admin123</p>
      <p id="loginError" class="hidden text-red-600 text-sm"></p>
    </section>
  </main>

  <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-3"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
